<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>ROUTEEN</title>
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9ddef"/>
      <stop offset="0.7" stop-color="#f4cdb3"/>
      <stop offset="1" stop-color="#f2b894"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#dawn)"/>
  <!-- The day's arc, from the day's start to its end, over the horizon. -->
  <path d="M 96 360 A 160 160 0 0 1 416 360" fill="none" stroke="#27201f" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 30"/>
  <!-- The ground. -->
  <rect x="0" y="360" width="512" height="152" fill="#27201f"/>
  <!-- The sun, risen part of the way along the arc. -->
  <circle cx="162" cy="231" r="50" fill="#9a5a14"/>
  <circle cx="162" cy="231" r="50" fill="none" stroke="#27201f" stroke-width="10"/>
</svg>
